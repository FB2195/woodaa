appId: de.woodaa.desktop
productName: woodaa für Einrichtungen
directories:
  output: release
files:
  - out/**/*
  - package.json
# afterSign: scripts/afterSignAdhoc.cjs  # temporarily disabled - isolation test for the startup crash, see PR discussion
mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
