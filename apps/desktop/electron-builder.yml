appId: de.woodaa.desktop
productName: woodaa für Einrichtungen
directories:
  output: release
files:
  - out/**/*
  - package.json
# Re-testing with the now-fixed signing/notarization pipeline - the
# earlier asar:false attempt never actually got a valid comparison
# because notarization was failing regardless (missing loose-file
# signatures) at the time. See desktop-release.yml for the diagnostic
# history.
asar: false
afterSign: scripts/afterSignAdhoc.cjs
mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
