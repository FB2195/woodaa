name: Desktop Release

# Manual for now (internal test builds, unsigned - no Apple Developer ID or
# Windows code-signing cert configured yet). Runs on the native OS for each
# target since electron-builder's dmg/nsis packaging isn't reliably
# cross-buildable from Linux.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: release/*.dmg
          - os: windows-latest
            script: build:win
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}

    env:
      VITE_API_URL: https://www.woodaa.de

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolation test (macOS) - does a bare, unmodified Electron demo crash here too?
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          # Diagnostic only - continue-on-error above means this step can
          # never block Build installer or the real smoke test below,
          # regardless of what happens inside it. Downloads Electron's own
          # official prebuilt binary directly (not via node_modules/electron,
          # whose postinstall download apparently didn't run under pnpm here)
          # - no woodaa code, no electron-builder packaging, no custom
          # signing/entitlements from our afterSign hook. If this crashes the
          # same way, the cause is Electron/V8 vs. this specific runner/
          # macOS/chip combination, not anything in our build config.
          curl -sSL -o /tmp/electron.zip \
            https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-darwin-arm64.zip
          mkdir -p /tmp/electron-bare
          unzip -q /tmp/electron.zip -d /tmp/electron-bare
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "Could not extract Electron.app - skipping isolation test."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"
          echo "Launching bare $EXECUTABLE (Electron's own official prebuilt binary, no woodaa code/packaging at all)"
          "$EXECUTABLE" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "ISOLATION RESULT: bare Electron demo is still running after 10s - did NOT crash."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            EXIT_CODE=0
            wait "$PID" || EXIT_CODE=$?
            echo "ISOLATION RESULT: bare Electron demo exited within 10s (code $EXIT_CODE) - CRASHED, same as our app."
          fi

      - name: Write Apple notarization API key (macOS, only if configured)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # secrets.* isn't allowed in a step's `if:`, so the "only if
          # configured" check happens here instead - if the secret is unset
          # this is a no-op and the ad-hoc signing fallback stays active.
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 not set - skipping (ad-hoc signing fallback will be used)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build installer
        # On macOS, real code signing + notarization activate automatically
        # once CSC_LINK (a base64-encoded "Developer ID Application" .p12) and
        # the APPLE_* secrets are configured in this repo - see
        # apps/desktop/scripts/afterSignAdhoc.cjs for how the ad-hoc fallback
        # steps aside when that happens. Until then these all evaluate to
        # empty strings and behavior is unchanged.
        run: pnpm --filter desktop run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify code signature and entitlements (macOS)
        # Regardless of ad-hoc vs. real Developer ID signing, confirm what
        # actually landed in the shipped bundle - the afterSign hook only
        # prints this itself in the ad-hoc fallback path, so the real-signing
        # path (electron-builder's own @electron/osx-sign call) has never
        # been checked here before.
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          codesign -dvvv --entitlements - "$APP_PATH"

      - name: Sign bare Electron with our real cert (macOS, diagnostic only)
        # Isolates whether a real crash report from a user's Mac (EXC_BREAKPOINT/
        # SIGTRAP, no window ever appears) is caused by Electron + hardened
        # runtime + our real Developer ID cert in general, or by something
        # specific to woodaa's own packaged app/code. The earlier isolation
        # test above only proved unsigned bare Electron doesn't crash - not a
        # clean comparison, since the crashing app is hardened-runtime-signed.
        # This produces the missing middle data point: bare Electron, signed
        # exactly like our real app, no woodaa code at all. Not notarized
        # (would add another 15-40min wait) - the user strips the quarantine
        # xattr locally before running it instead.
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set - skipping diagnostic signed-bare-Electron build."
            exit 0
          fi
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "No bare Electron.app from the isolation test above - skipping."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/diagnostic-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/diagnostic-cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the diagnostic keychain - skipping."
            exit 0
          fi
          echo "Signing bare Electron.app with $IDENTITY"

          ENTITLEMENTS="$GITHUB_WORKSPACE/apps/desktop/resources/entitlements.mac.plist"
          codesign --deep --force --options runtime --sign "$IDENTITY" \
            --entitlements "$ENTITLEMENTS" --keychain "$KEYCHAIN_PATH" "$ELECTRON_APP"
          codesign -dvvv --entitlements - "$ELECTRON_APP"

          mkdir -p /tmp/electron-bare-signed
          ditto -c -k --sequesterRsrc --keepParent "$ELECTRON_APP" /tmp/electron-bare-signed/electron-bare-signed.zip

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: electron-bare-signed-diagnostic
          path: /tmp/electron-bare-signed/electron-bare-signed.zip
          if-no-files-found: ignore

      - name: Smoke test (macOS) - launch the packaged app, fail if it crashes on startup
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_NAME"
          # A real downloaded app carries a Gatekeeper quarantine xattr,
          # which triggers a stricter runtime assessment than a bare local
          # launch does. A user report showed the notarized build crashing
          # on real hardware (EXC_BREAKPOINT/SIGTRAP at startup) even though
          # this smoke test passed - reproducing that gap here so CI can
          # actually catch it instead of only finding out from a crash
          # report days later.
          xattr -w com.apple.quarantine "0081;00000000;Chrome;" "$APP_PATH"
          echo "Launching $EXECUTABLE under lldb (quarantined, simulating a real download)"
          # macOS's async ReportCrash daemon doesn't appear to run on these
          # ephemeral CI images (no crash report ever showed up under
          # ~/Library/Logs/DiagnosticReports/ despite the app reliably
          # crashing). lldb catches the signal synchronously instead and can
          # print a full symbolicated backtrace of every thread right there,
          # without depending on that daemon at all.
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" \
            > lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "Still running after 15s under lldb - looks healthy, stopping."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            cat lldb-output.txt
            exit 0
          fi
          wait "$LLDB_PID" || true
          echo "===== lldb output ====="
          cat lldb-output.txt
          echo "===== end lldb output ====="
          if grep -q "stop reason" lldb-output.txt; then
            echo "App crashed - see backtrace above."
            exit 1
          fi
          echo "lldb exited without a crash stop reason - treating as healthy."

      - uses: actions/upload-artifact@v4
        with:
          name: woodaa-desktop-${{ matrix.os }}
          path: apps/desktop/${{ matrix.artifact }}
