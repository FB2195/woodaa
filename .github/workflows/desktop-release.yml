name: Desktop Release

# Manual for now (internal test builds, unsigned - no Apple Developer ID or
# Windows code-signing cert configured yet). Runs on the native OS for each
# target since electron-builder's dmg/nsis packaging isn't reliably
# cross-buildable from Linux.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: release/*.dmg
          - os: windows-latest
            script: build:win
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}

    env:
      VITE_API_URL: https://www.woodaa.de

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolation test (macOS) - does a bare, unmodified Electron demo crash here too?
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          # Diagnostic only - continue-on-error above means this step can
          # never block Build installer or the real smoke test below,
          # regardless of what happens inside it. Downloads Electron's own
          # official prebuilt binary directly (not via node_modules/electron,
          # whose postinstall download apparently didn't run under pnpm here)
          # - no woodaa code, no electron-builder packaging, no custom
          # signing/entitlements from our afterSign hook. If this crashes the
          # same way, the cause is Electron/V8 vs. this specific runner/
          # macOS/chip combination, not anything in our build config.
          curl -sSL -o /tmp/electron.zip \
            https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-darwin-arm64.zip
          mkdir -p /tmp/electron-bare
          unzip -q /tmp/electron.zip -d /tmp/electron-bare
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "Could not extract Electron.app - skipping isolation test."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"
          echo "Launching bare $EXECUTABLE (Electron's own official prebuilt binary, no woodaa code/packaging at all)"
          "$EXECUTABLE" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "ISOLATION RESULT: bare Electron demo is still running after 10s - did NOT crash."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            EXIT_CODE=0
            wait "$PID" || EXIT_CODE=$?
            echo "ISOLATION RESULT: bare Electron demo exited within 10s (code $EXIT_CODE) - CRASHED, same as our app."
          fi

      - name: Write Apple notarization API key (macOS, only if configured)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # secrets.* isn't allowed in a step's `if:`, so the "only if
          # configured" check happens here instead - if the secret is unset
          # this is a no-op and the ad-hoc signing fallback stays active.
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 not set - skipping (ad-hoc signing fallback will be used)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build installer
        # On macOS, real code signing + notarization activate automatically
        # once CSC_LINK (a base64-encoded "Developer ID Application" .p12) and
        # the APPLE_* secrets are configured in this repo - see
        # apps/desktop/scripts/afterSignAdhoc.cjs for how the ad-hoc fallback
        # steps aside when that happens. Until then these all evaluate to
        # empty strings and behavior is unchanged.
        run: pnpm --filter desktop run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify code signature and entitlements (macOS)
        # Regardless of ad-hoc vs. real Developer ID signing, confirm what
        # actually landed in the shipped bundle - the afterSign hook only
        # prints this itself in the ad-hoc fallback path, so the real-signing
        # path (electron-builder's own @electron/osx-sign call) has never
        # been checked here before.
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          codesign -dvvv --entitlements - "$APP_PATH"

      - name: Sign bare Electron with our real cert (macOS, diagnostic only)
        # Isolates whether a real crash report from a user's Mac (EXC_BREAKPOINT/
        # SIGTRAP, no window ever appears) is caused by Electron + hardened
        # runtime + our real Developer ID cert in general, or by something
        # specific to woodaa's own packaged app/code. The earlier isolation
        # test above only proved unsigned bare Electron doesn't crash - not a
        # clean comparison, since the crashing app is hardened-runtime-signed.
        # This produces the missing middle data point: bare Electron, signed
        # exactly like our real app, no woodaa code at all. Not notarized
        # (would add another 15-40min wait) - the user strips the quarantine
        # xattr locally before running it instead.
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set - skipping diagnostic signed-bare-Electron build."
            exit 0
          fi
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "No bare Electron.app from the isolation test above - skipping."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/diagnostic-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/diagnostic-cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the diagnostic keychain - skipping."
            exit 0
          fi
          echo "Signing bare Electron.app with $IDENTITY"

          ENTITLEMENTS="$GITHUB_WORKSPACE/apps/desktop/resources/entitlements.mac.plist"
          codesign --deep --force --options runtime --sign "$IDENTITY" \
            --entitlements "$ENTITLEMENTS" --keychain "$KEYCHAIN_PATH" "$ELECTRON_APP"
          codesign -dvvv --entitlements - "$ELECTRON_APP"

          mkdir -p /tmp/electron-bare-signed
          ditto -c -k --sequesterRsrc --keepParent "$ELECTRON_APP" /tmp/electron-bare-signed/electron-bare-signed.zip

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: electron-bare-signed-diagnostic
          path: /tmp/electron-bare-signed/electron-bare-signed.zip
          if-no-files-found: ignore

      - name: Smoke test full app re-signed with flat --deep (macOS, diagnostic only)
        # Every diagnostic in this job signs with a single flat `codesign
        # --deep` pass and has NEVER crashed (9/9 clean across prior runs,
        # vs. the real app's ~60% crash rate - not chance). electron-builder
        # itself (via @electron/osx-sign) instead signs every nested
        # .framework/.app individually, deepest-first, which is the
        # "correct" Apple-recommended method - and is the one remaining
        # difference between our diagnostics and the real crashing app.
        # This takes the actual built+notarized app, re-signs a COPY of it
        # with the same flat --deep approach (invalidating notarization,
        # which is fine - we're only checking whether it still crashes),
        # and smoke-tests that copy to isolate the signing method itself
        # as a variable.
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set - skipping."
            exit 0
          fi
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          KEYCHAIN_PATH="$RUNNER_TEMP/diagnostic-signing.keychain-db"
          if [ -z "$APP_PATH" ] || [ ! -f "$KEYCHAIN_PATH" ]; then
            echo "No packaged app or diagnostic keychain to test - skipping."
            exit 0
          fi
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found - skipping."
            exit 0
          fi

          rm -rf /tmp/deep-resigned.app
          cp -R "$APP_PATH" /tmp/deep-resigned.app
          ENTITLEMENTS="$GITHUB_WORKSPACE/apps/desktop/resources/entitlements.mac.plist"
          codesign --deep --force --options runtime --sign "$IDENTITY" \
            --entitlements "$ENTITLEMENTS" --keychain "$KEYCHAIN_PATH" /tmp/deep-resigned.app
          codesign -dvvv --entitlements - /tmp/deep-resigned.app

          EXECUTABLE="/tmp/deep-resigned.app/Contents/MacOS/$(basename "$APP_PATH" .app)"
          echo "Launching flat---deep-re-signed full app under lldb"
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" \
            > deep-resigned-lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "DEEP-RESIGNED FULL APP RESULT: still running after 15s - did NOT crash."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            exit 0
          fi
          wait "$LLDB_PID" || true
          cat deep-resigned-lldb-output.txt
          if grep -q "stop reason" deep-resigned-lldb-output.txt; then
            echo "DEEP-RESIGNED FULL APP RESULT: CRASHED (see backtrace above) - the signing method is not the trigger."
          else
            echo "DEEP-RESIGNED FULL APP RESULT: exited without a crash stop reason - treating as healthy."
          fi

      - name: Smoke test signed bare Electron (macOS, diagnostic only) - same crash class, no woodaa code
        # The real app's smoke test below is intermittent (crashes maybe half
        # the time - a real user report and a prior CI run hit the identical
        # crash address, but the very next identical run passed). A single
        # pass/fail on the real app can't tell us whether that's an
        # Electron-level bug or something in our own code/packaging. This
        # runs the SAME crash-hunting lldb check against the bare,
        # real-cert-signed Electron built just above (zero woodaa code) so
        # every workflow run produces a same-run comparison point instead of
        # requiring several separate runs.
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "No signed bare Electron.app to test - skipping."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"
          xattr -w com.apple.quarantine "0081;00000000;Chrome;" "$ELECTRON_APP"
          echo "Launching signed bare $EXECUTABLE under lldb (quarantined)"
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" \
            > bare-lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "BARE SIGNED ELECTRON RESULT: still running after 15s - did NOT crash."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            exit 0
          fi
          wait "$LLDB_PID" || true
          cat bare-lldb-output.txt
          if grep -q "stop reason" bare-lldb-output.txt; then
            echo "BARE SIGNED ELECTRON RESULT: CRASHED (see backtrace above) - same crash class as our packaged app, with zero woodaa code involved."
          else
            echo "BARE SIGNED ELECTRON RESULT: exited without a crash stop reason - treating as healthy."
          fi

      - name: Smoke test signed Electron + trivial custom main.js (macOS, diagnostic only)
        # Bisecting further: the step above proved bare signed Electron (its
        # own internal default_app, no custom main.js at all) doesn't crash,
        # but our real packaged app (full main.ts - safeStorage, ipcMain,
        # preload, loading real renderer content) does. This is the missing
        # middle rung - the same signed Electron binary, given the smallest
        # possible custom main.js (one BrowserWindow, nothing else) via
        # Electron's `electron path-to-app` CLI convention. If this crashes,
        # the trigger is "any custom app loaded at all" (something structural
        # in how a real vs. default_app boots) rather than anything specific
        # in our own main.ts.
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "No signed bare Electron.app to test - skipping."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"

          mkdir -p /tmp/minimal-app
          cat > /tmp/minimal-app/package.json <<'JSON'
          {"name": "minimal-app", "main": "index.js"}
          JSON
          cat > /tmp/minimal-app/index.js <<'JS'
          const { app, BrowserWindow } = require("electron");
          app.whenReady().then(() => {
            new BrowserWindow({ show: false });
          });
          JS

          echo "Launching signed Electron + minimal custom main.js under lldb (quarantined)"
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" /tmp/minimal-app \
            > minimal-lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "MINIMAL CUSTOM APP RESULT: still running after 15s - did NOT crash."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            exit 0
          fi
          wait "$LLDB_PID" || true
          cat minimal-lldb-output.txt
          if grep -q "stop reason" minimal-lldb-output.txt; then
            echo "MINIMAL CUSTOM APP RESULT: CRASHED (see backtrace above) - a trivial custom main.js is enough to trigger it, not anything specific to woodaa's own code."
          else
            echo "MINIMAL CUSTOM APP RESULT: exited without a crash stop reason - treating as healthy."
          fi

      - name: Smoke test signed Electron + real renderer, no safeStorage/preload (macOS, diagnostic only)
        # Narrows further: a trivial custom main.js (previous step) does NOT
        # crash, but our full app (safeStorage + ipcMain + preload +
        # contextIsolation + the real ~520KB React/tRPC renderer bundle,
        # which fetches https://www.woodaa.de on load) does. This isolates
        # just the renderer half - load the actual built out/renderer/
        # index.html, but with no preload script and no safeStorage/ipcMain
        # at all - to see if the real UI bundle alone is enough to trigger
        # it, independent of the auth/keychain code in main.ts.
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          RENDERER_HTML="$GITHUB_WORKSPACE/apps/desktop/out/renderer/index.html"
          if [ -z "$ELECTRON_APP" ] || [ ! -f "$RENDERER_HTML" ]; then
            echo "No signed bare Electron.app or built renderer to test - skipping."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"

          mkdir -p /tmp/renderer-only-app
          cat > /tmp/renderer-only-app/package.json <<'JSON'
          {"name": "renderer-only-app", "main": "index.js"}
          JSON
          cat > /tmp/renderer-only-app/index.js <<JS
          const { app, BrowserWindow } = require("electron");
          app.whenReady().then(() => {
            // show left at its default (true), like the real app's
            // createWindow() - every earlier diagnostic used show:false,
            // which never needed the runner to actually composite/display
            // anything. If this is what makes the difference, it points at
            // on-screen rendering/WindowServer interaction rather than
            // safeStorage/preload/ipcMain.
            const win = new BrowserWindow({ width: 1360, height: 860 });
            win.loadFile("$RENDERER_HTML");
          });
          JS

          echo "Launching signed Electron + real renderer bundle (no safeStorage/preload) under lldb (quarantined)"
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" /tmp/renderer-only-app \
            > renderer-only-lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "RENDERER-ONLY RESULT: still running after 15s - did NOT crash."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            exit 0
          fi
          wait "$LLDB_PID" || true
          cat renderer-only-lldb-output.txt
          if grep -q "stop reason" renderer-only-lldb-output.txt; then
            echo "RENDERER-ONLY RESULT: CRASHED (see backtrace above) - the real renderer bundle alone is enough, independent of safeStorage/preload/ipcMain."
          else
            echo "RENDERER-ONLY RESULT: exited without a crash stop reason - treating as healthy."
          fi

      - name: Smoke test signed Electron + our real main.ts/preload.ts, no asar packaging (macOS, diagnostic only)
        # Across every run so far: bare Electron, a trivial custom main.js,
        # and the real renderer bundle with no preload/safeStorage/ipcMain
        # have NEVER crashed once (0 crashes across ~7-8 attempts each).
        # Only the real packaged app crashes, and does so most of the time.
        # The one remaining difference is the auth/keychain code in
        # main.ts (safeStorage, ipcMain handlers) plus the preload script's
        # contextBridge/contextIsolation setup. This runs our ACTUAL built
        # out/main/main.js and out/preload/preload.js - unmodified, just not
        # packaged into an .asar by electron-builder - to confirm whether
        # that code alone reproduces the crash at a similar rate.
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          REAL_OUT_DIR="$GITHUB_WORKSPACE/apps/desktop/out"
          if [ -z "$ELECTRON_APP" ] || [ ! -d "$REAL_OUT_DIR" ]; then
            echo "No signed bare Electron.app or built out/ dir to test - skipping."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"

          rm -rf /tmp/real-main-app
          mkdir -p /tmp/real-main-app
          cp -R "$REAL_OUT_DIR"/. /tmp/real-main-app/
          cat > /tmp/real-main-app/package.json <<'JSON'
          {"name": "real-main-app", "main": "main/main.js"}
          JSON

          echo "Launching signed Electron + our real main.ts/preload.ts (no asar) under lldb (quarantined)"
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" /tmp/real-main-app \
            > real-main-lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "REAL MAIN.TS RESULT: still running after 15s - did NOT crash."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            exit 0
          fi
          wait "$LLDB_PID" || true
          cat real-main-lldb-output.txt
          if grep -q "stop reason" real-main-lldb-output.txt; then
            echo "REAL MAIN.TS RESULT: CRASHED (see backtrace above) - our real main.ts/preload.ts is enough on its own, confirming safeStorage/ipcMain/preload as the trigger."
          else
            echo "REAL MAIN.TS RESULT: exited without a crash stop reason - treating as healthy."
          fi

      - name: Smoke test (macOS) - launch the packaged app, fail if it crashes on startup
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_NAME"
          # A real downloaded app carries a Gatekeeper quarantine xattr,
          # which triggers a stricter runtime assessment than a bare local
          # launch does. A user report showed the notarized build crashing
          # on real hardware (EXC_BREAKPOINT/SIGTRAP at startup) even though
          # this smoke test passed - reproducing that gap here so CI can
          # actually catch it instead of only finding out from a crash
          # report days later.
          xattr -w com.apple.quarantine "0081;00000000;Chrome;" "$APP_PATH"
          echo "Launching $EXECUTABLE under lldb (quarantined, simulating a real download)"
          # macOS's async ReportCrash daemon doesn't appear to run on these
          # ephemeral CI images (no crash report ever showed up under
          # ~/Library/Logs/DiagnosticReports/ despite the app reliably
          # crashing). lldb catches the signal synchronously instead and can
          # print a full symbolicated backtrace of every thread right there,
          # without depending on that daemon at all.
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" \
            > lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "Still running after 15s under lldb - looks healthy, stopping."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            cat lldb-output.txt
            exit 0
          fi
          wait "$LLDB_PID" || true
          echo "===== lldb output ====="
          cat lldb-output.txt
          echo "===== end lldb output ====="
          if grep -q "stop reason" lldb-output.txt; then
            echo "App crashed - see backtrace above."
            exit 1
          fi
          echo "lldb exited without a crash stop reason - treating as healthy."

      - uses: actions/upload-artifact@v4
        with:
          name: woodaa-desktop-${{ matrix.os }}
          path: apps/desktop/${{ matrix.artifact }}
