name: Desktop Release

# Manual for now (internal test builds, unsigned - no Apple Developer ID or
# Windows code-signing cert configured yet). Runs on the native OS for each
# target since electron-builder's dmg/nsis packaging isn't reliably
# cross-buildable from Linux.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: release/*.dmg
          - os: windows-latest
            script: build:win
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}

    env:
      VITE_API_URL: https://www.woodaa.de

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolation test (macOS) - does a bare, unmodified Electron demo crash here too?
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          # Diagnostic only - continue-on-error above means this step can
          # never block Build installer or the real smoke test below,
          # regardless of what happens inside it. Downloads Electron's own
          # official prebuilt binary directly (not via node_modules/electron,
          # whose postinstall download apparently didn't run under pnpm here)
          # - no woodaa code, no electron-builder packaging, no custom
          # signing/entitlements from our afterSign hook. If this crashes the
          # same way, the cause is Electron/V8 vs. this specific runner/
          # macOS/chip combination, not anything in our build config.
          curl -sSL -o /tmp/electron.zip \
            https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-darwin-arm64.zip
          mkdir -p /tmp/electron-bare
          unzip -q /tmp/electron.zip -d /tmp/electron-bare
          ELECTRON_APP=$(find /tmp/electron-bare -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$ELECTRON_APP" ]; then
            echo "Could not extract Electron.app - skipping isolation test."
            exit 0
          fi
          EXECUTABLE="$ELECTRON_APP/Contents/MacOS/$(basename "$ELECTRON_APP" .app)"
          echo "Launching bare $EXECUTABLE (Electron's own official prebuilt binary, no woodaa code/packaging at all)"
          "$EXECUTABLE" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "ISOLATION RESULT: bare Electron demo is still running after 10s - did NOT crash."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            EXIT_CODE=0
            wait "$PID" || EXIT_CODE=$?
            echo "ISOLATION RESULT: bare Electron demo exited within 10s (code $EXIT_CODE) - CRASHED, same as our app."
          fi

      - name: Write Apple notarization API key (macOS, only if configured)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # secrets.* isn't allowed in a step's `if:`, so the "only if
          # configured" check happens here instead - if the secret is unset
          # this is a no-op and the ad-hoc signing fallback stays active.
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 not set - skipping (ad-hoc signing fallback will be used)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build installer
        # On macOS, real code signing + notarization activate automatically
        # once CSC_LINK (a base64-encoded "Developer ID Application" .p12) and
        # the APPLE_* secrets are configured in this repo - see
        # apps/desktop/scripts/afterSignAdhoc.cjs for how the ad-hoc fallback
        # steps aside when that happens. Until then these all evaluate to
        # empty strings and behavior is unchanged.
        run: pnpm --filter desktop run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke test (macOS) - launch the packaged app, fail if it crashes on startup
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_NAME"
          echo "Launching $EXECUTABLE under lldb"
          # macOS's async ReportCrash daemon doesn't appear to run on these
          # ephemeral CI images (no crash report ever showed up under
          # ~/Library/Logs/DiagnosticReports/ despite the app reliably
          # crashing). lldb catches the signal synchronously instead and can
          # print a full symbolicated backtrace of every thread right there,
          # without depending on that daemon at all.
          lldb --batch -o "run" -o "thread backtrace all" -o "quit" -- "$EXECUTABLE" \
            > lldb-output.txt 2>&1 &
          LLDB_PID=$!
          for i in $(seq 1 15); do
            kill -0 "$LLDB_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$LLDB_PID" 2>/dev/null; then
            echo "Still running after 15s under lldb - looks healthy, stopping."
            kill "$LLDB_PID" 2>/dev/null || true
            wait "$LLDB_PID" 2>/dev/null || true
            cat lldb-output.txt
            exit 0
          fi
          wait "$LLDB_PID" || true
          echo "===== lldb output ====="
          cat lldb-output.txt
          echo "===== end lldb output ====="
          if grep -q "stop reason" lldb-output.txt; then
            echo "App crashed - see backtrace above."
            exit 1
          fi
          echo "lldb exited without a crash stop reason - treating as healthy."

      - uses: actions/upload-artifact@v4
        with:
          name: woodaa-desktop-${{ matrix.os }}
          path: apps/desktop/${{ matrix.artifact }}
