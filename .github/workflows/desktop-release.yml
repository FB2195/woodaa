name: Desktop Release

# Manual for now (internal test builds, unsigned - no Apple Developer ID or
# Windows code-signing cert configured yet). Runs on the native OS for each
# target since electron-builder's dmg/nsis packaging isn't reliably
# cross-buildable from Linux.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: release/*.dmg
          - os: windows-latest
            script: build:win
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}

    env:
      VITE_API_URL: https://www.woodaa.de

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm --filter desktop run ${{ matrix.script }}

      - name: Smoke test (macOS) - launch the packaged app, fail if it crashes on startup
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          APP_PATH=$(find apps/desktop/release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/desktop/release"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_NAME"
          echo "Launching $EXECUTABLE"
          "$EXECUTABLE" &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "Still running after 8s - looks healthy."
            kill "$PID"
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID"
            EXIT_CODE=$?
            echo "Exited within 8s (code $EXIT_CODE) - this usually means it crashed on startup."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: woodaa-desktop-${{ matrix.os }}
          path: apps/desktop/${{ matrix.artifact }}
