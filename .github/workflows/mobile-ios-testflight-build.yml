name: Mobile iOS TestFlight Build

# Manual for now, mirrors mobile-preview-build.yml but for iOS: builds a
# store-signed IPA via EAS and auto-submits it to TestFlight (--auto-submit
# uses the eas.json submit profile with the same name as the build
# profile - "testflight" for both here). Unlike the Android preview APK,
# an iOS build can't just be downloaded and side-loaded - TestFlight is the
# only practical way to get a build onto a real iPhone without a Mac.
#
# iOS code signing uses eas.json's credentialsSource: "local" (see
# apps/mobile/eas.json's testflight build profile) - the Distribution
# Certificate + Provisioning Profile are written from repository secrets
# below, not managed interactively by EAS. This avoids `eas build`'s
# interactive Apple-account login, which only accepts a real Apple ID
# password (not an app-specific one) and can't run non-interactively in
# CI. The certificate was generated once outside of Xcode (a locally
# generated CSR signed by Apple's Developer Portal - standard PKI, same
# as what Xcode/Keychain Access do) and doesn't need to be regenerated
# unless it's revoked or expires (1 year from creation).
#
# Requires these repository secrets in addition to EXPO_TOKEN (already
# used by mobile-preview-build.yml):
#   EAS_APPLE_ASC_KEY_ID           - App Store Connect API Key ID (for
#                                     eas submit / TestFlight upload)
#   EAS_APPLE_ASC_ISSUER_ID        - App Store Connect API Key Issuer ID
#   EAS_APPLE_ASC_API_KEY          - full contents of the downloaded .p8 key file
#   IOS_DISTRIBUTION_P12_BASE64    - base64 of the Distribution Certificate .p12
#   IOS_DISTRIBUTION_P12_PASSWORD  - password for that .p12 file
#   IOS_PROVISIONING_PROFILE_BASE64 - base64 of the .mobileprovision file
# See https://appstoreconnect.apple.com/access/integrations/api to create
# the API key (Admin role) and get the first three values.
#
# Also requires apps/mobile/eas.json's submit.testflight.ios to be filled
# in with appleTeamId + ascAppId (not secret, just identifiers - see
# apps/mobile/eas.json).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Write App Store Connect API key
        working-directory: apps/mobile
        env:
          EAS_APPLE_ASC_API_KEY: ${{ secrets.EAS_APPLE_ASC_API_KEY }}
          EAS_APPLE_ASC_KEY_ID: ${{ secrets.EAS_APPLE_ASC_KEY_ID }}
          EAS_APPLE_ASC_ISSUER_ID: ${{ secrets.EAS_APPLE_ASC_ISSUER_ID }}
        run: |
          printf '%s' "$EAS_APPLE_ASC_API_KEY" > AuthKey.p8
          # eas build --auto-submit validates eas.json's submit profile up
          # front (even though eas build itself also accepts the ASC key via
          # the EXPO_ASC_* env vars below) - ascApiKeyIssuerId/ascApiKeyId
          # aren't secret (just identifiers, the .p8 file is the actual
          # secret) but are patched in here at runtime rather than committed,
          # to keep all Apple-related config in one place (repo secrets).
          node -e "
            const fs = require('fs');
            const easJson = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            easJson.submit.testflight.ios.ascApiKeyId = process.env.EAS_APPLE_ASC_KEY_ID;
            easJson.submit.testflight.ios.ascApiKeyIssuerId = process.env.EAS_APPLE_ASC_ISSUER_ID;
            fs.writeFileSync('eas.json', JSON.stringify(easJson, null, 2));
          "

      - name: Write iOS distribution credentials
        working-directory: apps/mobile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ios-certs
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -d > ios-certs/dist.p12
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ios-certs/profile.mobileprovision
          node -e "
            const fs = require('fs');
            fs.writeFileSync('credentials.json', JSON.stringify({
              ios: {
                provisioningProfilePath: 'ios-certs/profile.mobileprovision',
                distributionCertificate: {
                  path: 'ios-certs/dist.p12',
                  password: process.env.IOS_DISTRIBUTION_P12_PASSWORD,
                },
              },
            }, null, 2));
          "

      - name: Build + submit to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ./AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EAS_APPLE_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EAS_APPLE_ASC_ISSUER_ID }}
        run: |
          eas build --platform ios --profile testflight --non-interactive --wait --auto-submit --json > build-result.json
          cat build-result.json

      - name: Clean up credential files
        if: always()
        working-directory: apps/mobile
        run: rm -f AuthKey.p8 credentials.json ios-certs/dist.p12 ios-certs/profile.mobileprovision
