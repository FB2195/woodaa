name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woodaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woodaa
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/woodaa
      # Separate database on the same Postgres service - packages/api's
      # integration tests (src/testDb.ts) truncate every table between
      # tests, so they must never point at the same database as the build
      # step above.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woodaa_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        # mobile#build occasionally fails with a transient Metro/Babel
        # worker error ("Cannot find module 'react-native-worklets/plugin'")
        # that's never been reproducible locally and isn't a real missing
        # dependency (confirmed via `pnpm why`) - retry once before failing
        # the job. Turbo's local cache makes the retry only re-run the task
        # that actually failed.
        run: pnpm turbo run build || pnpm turbo run build

      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE woodaa_test;"
        env:
          PGPASSWORD: postgres

      - name: Migrate test database
        run: pnpm --filter @woodaa/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm turbo run test
